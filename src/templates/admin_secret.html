<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riku Library | Secret Chamber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family: 'Outfit', sans-serif;
            --color-bg: #05070c;
            --color-card-bg: rgba(18, 14, 30, 0.6);
            --color-border: rgba(168, 85, 247, 0.15);
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #c084fc;
            --color-text-muted: #7e22ce;
            --grad-primary: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            --grad-primary-hover: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
            --shadow-glow: 0 0 30px rgba(168, 85, 247, 0.3);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
            --border-radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 700px;
            z-index: 1;
        }

        .glass-panel {
            background: var(--color-card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-glow);
            padding: 3rem;
            text-align: center;
            position: relative;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--border-radius-lg);
            padding: 1px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .secret-badge {
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: #f472b6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.35rem 0.85rem;
            border-radius: var(--border-radius-full);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .secret-badge span {
            width: 8px;
            height: 8px;
            background: #ec4899;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--color-text-secondary);
            margin-bottom: 2.5rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 1.5rem;
            border-radius: var(--border-radius-md);
            text-align: left;
        }

        .metric-card h4 {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .metric-card p {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            font-family: monospace;
        }

        .btn {
            font-family: var(--font-family);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: none;
            color: #fff;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--grad-primary);
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            background: var(--grad-primary-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <div class="secret-badge">
                <span></span>
                Classified: admin only
            </div>
            
            <h1 class="title">Administrative Sanctum</h1>
            <p class="subtitle">Welcome to the inner sanctum. You are authenticated with maximum root administrative clearance.</p>

            <div class="metrics-grid">
                <div class="metric-card">
                    <h4>Session Status</h4>
                    <p style="color: #10b981;">SECURE</p>
                </div>
                <div class="metric-card">
                    <h4>System Integrity</h4>
                    <p style="color: #a855f7;">100%</p>
                </div>
                <div class="metric-card">
                    <h4>Database Nodes</h4>
                    <p>ACTIVE (1)</p>
                </div>
                <div class="metric-card">
                    <h4>Riku AI Load</h4>
                    <p>0.04 ms</p>
                </div>
            </div>

            <a href="/admin" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
