<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riku Library | Access Denied</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family: 'Outfit', sans-serif;
            --color-bg: #0c0809;
            --color-card-bg: rgba(30, 16, 18, 0.6);
            --color-border: rgba(244, 63, 94, 0.15);
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #fca5a5;
            --grad-primary: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            --grad-primary-hover: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            --shadow-glow: 0 0 30px rgba(244, 63, 94, 0.25);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.12) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            z-index: 1;
        }

        .glass-panel {
            background: var(--color-card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-glow);
            padding: 3rem;
            text-align: center;
            position: relative;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--border-radius-lg);
            padding: 1px;
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.3) 0%, rgba(225, 29, 72, 0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .alert-icon {
            width: 64px;
            height: 64px;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: #f43f5e;
            border-radius: var(--border-radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .alert-icon svg {
            width: 32px;
            height: 32px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #f43f5e);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn {
            font-family: var(--font-family);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: none;
            color: #fff;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--grad-primary);
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            background: var(--grad-primary-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <div class="alert-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            
            <h1 class="title">Access Denied</h1>
            <p class="subtitle">You do not have the administrative privileges required to enter this chamber. Please contact system operations if you believe this is an error.</p>

            <a href="/admin" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
